name: Sahom Holding Trading Bot

on:
  schedule:
    - cron: '0 * * * *'  # يعمل تلقائياً في الدقيقة صفر من كل ساعة على مدار اليوم
  workflow_dispatch:      # يتيح لك تشغيله يدوياً متى شئت بضغطة زر

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python boti.py
