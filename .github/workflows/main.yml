name: Pro-Crypto-Scanner-Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # 🔄 تشغيل الرادار تلقائياً كل ساعتين لضمان استمرار التنبيهات
    - cron: '0 */2 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-pro-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests numpy pyTelegramBotAPI flask telethon
          
      - name: Run boti
        env:
          # يمكنك استخدام نفس السيركت أو إنشاء Secret جديد باسم PRO_BOT_TOKEN
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          # تشغيل البوت المنفصل الجديد بشكل نظيف
          python boty.py
