name: Pro-Crypto-Scanner-Bot

on:
  # ⏰ جدول زمني تلقائي: يعمل أوتوماتيكياً كل ساعتين تماماً
  schedule:
    - cron: '0 */2 * * *'
  
  # زر تشغيل يدوي اختياري إذا أردت تشغيله في أي وقت من قيت هاب
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-pro-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Pro Bot Auto Scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python boti.py
